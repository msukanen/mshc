[package]
name = "mshc"
version = "0.1.12"
edition = "2024"
authors = ["Markku Sukanen <markku.sukanen@gmail.com>"]
license = "MIT OR Apache-2.0"
description = "A tiny utility library…"
repository = "https://github.com/msukanen/mshc.git"

[dependencies]
mshc-derive = { path = "../mshc-derive", optional = true, version = "0.1.1" }
mshc-macro-shared = { path = "../mshc-macro-shared", version = "0.1.1" }
paste = "1.0.15"
proc-macro2 = "1.0.107"
quote = "1.0.47"
serde = { version = "1.0.229", features = ["derive"] }
syn = "3.0.3"

[features]
default = ["grade-f-to-sss"]
derive = ["dep:mshc-derive"]
grade-f-to-sss = []
grade-a2e = []

[badges]
maintenance = { status = "experimental" }
